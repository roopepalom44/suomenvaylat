name: Tests

on:
  pull_request:
  push:
    branches-ignore:
      - main
  # Julkaisutyönkulku kutsuu tätä ennen AddInX:n käännöstä.
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install static checker
        run: python -m pip install --disable-pip-version-check pyflakes==4.0.0

      - name: Static checks
        run: |
          python -m pyflakes Toolboxes qgis_plugin/suomenvaylat_qgis tests
          python -m py_compile Toolboxes/VaylaWFSDownloader.pyt Toolboxes/arcgis_downloader.py Toolboxes/arcgis_support.py qgis_plugin/package.py

      - name: Unit tests (ilman arcpyä ja verkkoa)
        run: python -m unittest discover -s tests -v

      - name: QGIS plugin package
        run: python qgis_plugin/package.py

  qgis-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native QGIS and Python bindings
        run: |
          # The Azure mirror can throttle large QGIS dependencies for minutes.
          for source_file in /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y qgis python3-qgis xvfb xauth
      - name: Offline QGIS geometry, file, UI and worker regressions
        run: |
          /usr/bin/python3 qgis_plugin/smoke_audit_fixes.py
          /usr/bin/python3 qgis_plugin/smoke_selection.py
          /usr/bin/python3 qgis_plugin/test_downloads.py
          /usr/bin/python3 SharedHelp/test_qgis_help.py
          timeout 120s xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 qgis --nologo --noversioncheck --profiles-path "$RUNNER_TEMP/shared-help-profile" --profile help-regression --code "$GITHUB_WORKSPACE/SharedHelp/test_native_qgis.py"
